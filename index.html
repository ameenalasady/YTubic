<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ytubic-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YTubic</title>
    <script>
      // Resolve and apply the persisted theme class before first paint to
      // avoid a light-mode flash while next-themes hydrates. Mirrors the
      // ThemeProvider config in src/App.tsx (storageKey, default).
      (function () {
        try {
          var t = localStorage.getItem("ytm-theme") || "system";
          var resolved;
          if (t === "system") {
            // Linux: prefer the XDG portal value cached by
            // src/lib/system-theme.ts. WebKitGTK's own query follows the
            // GTK theme and can disagree with the desktop's dark mode.
            var cached = null;
            if (
              /Linux/i.test(navigator.platform) &&
              !/Android/i.test(navigator.userAgent)
            ) {
              cached = localStorage.getItem("ytm-system-color-scheme");
            }
            var dark =
              cached === "dark"
                ? true
                : cached === "light"
                  ? false
                  : window.matchMedia("(prefers-color-scheme: dark)").matches;
            resolved = dark ? "dark" : "light";
          } else {
            resolved = t;
          }
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (_) {
          document.documentElement.classList.add("dark");
        }
      })();
      // Linux glass window: apply the persisted "Transparent window"
      // setting before first paint. Mirrors useWindowGlass() in
      // src/lib/window-glass.ts, which takes over once React mounts.
      (function () {
        try {
          if (
            !/Linux/i.test(navigator.platform) ||
            /Android/i.test(navigator.userAgent)
          )
            return;
          var raw = localStorage.getItem("ytm-settings");
          var s = (raw && JSON.parse(raw).state) || {};
          if (s.transparentWindow === false) return;
          var o = typeof s.windowOpacity === "number" ? s.windowOpacity : 80;
          document.documentElement.setAttribute("data-glass", "");
          document.documentElement.style.setProperty("--win-alpha", o / 100);
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
